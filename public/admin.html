<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LawBot · צ׳אטים עם לקוחות</title>
<style>
  :root{
    --bg:#0b141a; --panel:#111b21; --panel-2:#202c33; --line:#2a3942;
    --accent:#00a884; --accent-2:#005c4b; --in:#202c33; --out:#005c4b;
    --txt:#e9edef; --muted:#8696a0; --badge:#00a884; --danger:#f15c6d;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
    background:var(--bg);color:var(--txt);display:flex;height:100vh;overflow:hidden;
  }
  /* ───── Sidebar ───── */
  #sidebar{width:360px;min-width:300px;background:var(--panel);
    border-inline-end:1px solid var(--line);display:flex;flex-direction:column}
  .side-head{padding:14px 16px;background:var(--panel-2);
    display:flex;align-items:center;justify-content:space-between;gap:8px}
  .side-head h1{font-size:16px;margin:0;font-weight:600}
  .side-head .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);
    display:inline-block;margin-inline-end:6px}
  .side-head .dot.live{background:var(--accent)}
  #search{margin:8px;padding:8px 12px;border-radius:8px;border:none;
    background:var(--panel-2);color:var(--txt);outline:none;font-size:14px}
  #list{flex:1;overflow-y:auto}
  .conv{display:flex;gap:12px;padding:11px 14px;cursor:pointer;
    border-bottom:1px solid var(--line);align-items:center}
  .conv:hover{background:var(--panel-2)}
  .conv.active{background:var(--line)}
  .avatar{width:44px;height:44px;border-radius:50%;flex:0 0 auto;
    background:var(--accent-2);color:#fff;display:flex;align-items:center;
    justify-content:center;font-weight:600;font-size:16px}
  .conv-main{flex:1;min-width:0}
  .conv-top{display:flex;justify-content:space-between;gap:8px}
  .conv-name{font-weight:600;font-size:15px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .conv-time{font-size:11px;color:var(--muted);flex:0 0 auto}
  .conv-sub{display:flex;justify-content:space-between;gap:8px;margin-top:3px}
  .conv-last{font-size:13px;color:var(--muted);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;flex:1}
  .badge{background:var(--badge);color:#06281f;font-size:11px;font-weight:700;
    border-radius:11px;min-width:20px;height:20px;padding:0 6px;
    display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .conv-last .me{color:#7fa8a0}
  /* ───── Chat panel ───── */
  #chat{flex:1;display:flex;flex-direction:column;background:
    linear-gradient(rgba(11,20,26,.95),rgba(11,20,26,.95))}
  .chat-head{padding:12px 16px;background:var(--panel-2);
    display:flex;align-items:center;gap:12px;border-inline-start:1px solid var(--line)}
  .chat-head .meta{flex:1;min-width:0}
  .chat-head .meta .t{font-weight:600}
  .chat-head .meta .s{font-size:12px;color:var(--muted)}
  .chat-head a.folder{color:var(--accent);font-size:13px;text-decoration:none;
    border:1px solid var(--accent);padding:5px 10px;border-radius:7px}
  .chat-head a.folder:hover{background:var(--accent);color:#06281f}
  #messages{flex:1;overflow-y:auto;padding:18px 8%;display:flex;flex-direction:column;gap:4px}
  .bubble{max-width:70%;padding:7px 11px;border-radius:9px;font-size:14px;
    line-height:1.4;position:relative;white-space:pre-wrap;word-wrap:break-word}
  .bubble.in{align-self:flex-start;background:var(--in);border-top-right-radius:2px}
  .bubble.out{align-self:flex-end;background:var(--out);border-top-left-radius:2px}
  .bubble .time{font-size:10px;color:var(--muted);margin-top:3px;text-align:end}
  .bubble.media{font-style:italic;color:#cfe9e0}
  .day-sep{align-self:center;background:var(--panel-2);color:var(--muted);
    font-size:12px;padding:4px 12px;border-radius:8px;margin:10px 0}
  .empty{margin:auto;color:var(--muted);text-align:center}
  .compose{display:flex;gap:10px;padding:12px 16px;background:var(--panel-2)}
  .compose input{flex:1;padding:11px 14px;border-radius:9px;border:none;
    background:var(--panel);color:var(--txt);outline:none;font-size:14px}
  .compose button{background:var(--accent);color:#06281f;border:none;
    border-radius:9px;padding:0 18px;font-weight:700;cursor:pointer;font-size:14px}
  .compose button:disabled{opacity:.5;cursor:default}
  .toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);
    background:var(--danger);color:#fff;padding:10px 18px;border-radius:8px;
    font-size:14px;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  @media (max-width:720px){
    #sidebar{width:100%;position:absolute;inset:0;z-index:2}
    #sidebar.hidden{display:none}
    #chat{position:absolute;inset:0}
  }
</style>
</head>
<body>
  <div id="sidebar">
    <div class="side-head">
      <h1>💬 צ׳אטים עם לקוחות</h1>
      <span title="חיבור"><span class="dot" id="live"></span></span>
    </div>
    <input id="search" placeholder="חיפוש לפי שם או מספר…" />
    <div id="list"><div class="empty" style="padding:30px 10px">טוען…</div></div>
  </div>

  <div id="chat">
    <div id="chatBody" style="flex:1;display:flex;flex-direction:column">
      <div class="empty" style="margin:auto">בחר/י שיחה כדי להציג את ההתכתבות</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const API = '/api';
let state = { current:null, convos:[], pollT:null, msgT:null };

const $  = s => document.querySelector(s);
const esc = s => (s||'').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3000);
}
function initials(name, phone){
  if(name){ const p=name.trim().split(/\s+/); return (p[0][0]+(p[1]?.[0]||'')).toUpperCase(); }
  return (phone||'?').slice(-2);
}
function fmtTime(ts){
  if(!ts) return '';
  const d=new Date(ts), now=new Date();
  const sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
}
function dayLabel(ts){
  const d=new Date(ts), now=new Date();
  const y=new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString()===now.toDateString()) return 'היום';
  if(d.toDateString()===y.toDateString())   return 'אתמול';
  return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'});
}

async function api(path, opts){
  const r = await fetch(API+path, opts);
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

/* ───── Conversation list ───── */
async function loadList(){
  try{
    const { conversations } = await api('/conversations');
    state.convos = conversations || [];
    $('#live').classList.add('live');
    renderList();
  }catch(e){ $('#live').classList.remove('live'); }
}
function renderList(){
  const q = $('#search').value.trim().toLowerCase();
  const items = state.convos.filter(c =>
    !q || (c.name||'').toLowerCase().includes(q) || c.phone.includes(q));
  const list = $('#list');
  if(!items.length){ list.innerHTML='<div class="empty" style="padding:30px 10px">אין שיחות עדיין</div>'; return; }
  list.innerHTML = items.map(c => `
    <div class="conv ${c.phone===state.current?'active':''}" data-phone="${esc(c.phone)}">
      <div class="avatar">${esc(initials(c.name,c.phone))}</div>
      <div class="conv-main">
        <div class="conv-top">
          <span class="conv-name">${esc(c.name||c.phone)}</span>
          <span class="conv-time">${fmtTime(c.lastTs)}</span>
        </div>
        <div class="conv-sub">
          <span class="conv-last">${c.lastDir==='out'?'<span class="me">את/ה: </span>':''}${esc(c.lastText)}</span>
          ${c.unread>0?`<span class="badge">${c.unread}</span>`:''}
        </div>
      </div>
    </div>`).join('');
  list.querySelectorAll('.conv').forEach(el =>
    el.onclick = () => openChat(el.dataset.phone));
}

/* ───── Chat thread ───── */
async function openChat(phone){
  state.current = phone;
  clearInterval(state.msgT);
  renderList();
  if(window.innerWidth<=720) $('#sidebar').classList.add('hidden');
  await renderChat();
  state.msgT = setInterval(renderChat, 4000);
}
async function renderChat(){
  if(!state.current) return;
  let convo;
  try{ convo = await api('/conversations/'+encodeURIComponent(state.current)); }
  catch(e){ return; }

  const folderBtn = convo.folderId
    ? `<a class="folder" target="_blank" href="https://drive.google.com/drive/folders/${esc(convo.folderId)}">📁 תיקיית Drive</a>`
    : '';
  let last='';
  const rows = (convo.messages||[]).map(m=>{
    let sep='';
    const dl = dayLabel(m.ts);
    if(dl!==last){ sep=`<div class="day-sep">${dl}</div>`; last=dl; }
    const isMedia = m.type && m.type!=='text';
    const body = isMedia ? `📎 ${esc(m.type)}${m.text?': '+esc(m.text):''}` : esc(m.text);
    return `${sep}<div class="bubble ${m.direction==='in'?'in':'out'} ${isMedia?'media':''}">${body}<div class="time">${fmtTime(m.ts)}</div></div>`;
  }).join('');

  $('#chatBody').outerHTML = `
   <div id="chatBody" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <div class="chat-head">
      <div class="avatar">${esc(initials(convo.name,convo.phone))}</div>
      <div class="meta">
        <div class="t">${esc(convo.name||convo.phone)}</div>
        <div class="s">${esc(convo.phone)}${convo.state?' · '+esc(convo.state):''}</div>
      </div>
      ${folderBtn}
    </div>
    <div id="messages">${rows||'<div class="empty" style="margin:auto">אין הודעות</div>'}</div>
    <form class="compose" id="composeForm">
      <input id="replyInput" placeholder="כתוב/כתבי הודעה ללקוח…" autocomplete="off" />
      <button type="submit">שליחה</button>
    </form>
   </div>`;

  const msgs = $('#messages'); msgs.scrollTop = msgs.scrollHeight;
  $('#composeForm').onsubmit = sendReply;
}

async function sendReply(e){
  e.preventDefault();
  const input = $('#replyInput');
  const text  = input.value.trim();
  if(!text) return;
  const btn = e.target.querySelector('button');
  btn.disabled = true; input.disabled = true;
  try{
    await api('/conversations/'+encodeURIComponent(state.current)+'/reply', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text })
    });
    input.value='';
    await renderChat();
    loadList();
  }catch(err){ toast('שליחה נכשלה — בדוק/בדקי טוקן WhatsApp'); }
  finally{ btn.disabled=false; input.disabled=false; input.focus(); }
}

/* ───── Boot ───── */
$('#search').oninput = renderList;
loadList();
state.pollT = setInterval(loadList, 5000);
</script>
</body>
</html>
